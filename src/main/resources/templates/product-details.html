<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div th:replace="~{fragments/layout :: navbar}"></div>
<main class="container">
    <a th:href="@{/shops/{id}(id=${shop.id})}" class="btn btn-link px-0 mb-3"
       th:text="'← Back to ' + ${shop.name}">Back</a>

    <div class="row g-4">
        <div class="col-md-6">
            <img th:if="${product.imageBytes != null}"
                 th:src="@{/merchant/products/{id}/image(id=${product.id})}"
                 class="img-fluid rounded" th:alt="${product.name}">
        </div>
        <div class="col-md-6">
            <h1 th:text="${product.name}">Product</h1>
            <p class="fs-4" th:text="'$' + ${#numbers.formatDecimal(product.price, 1, 2)}">$0.00</p>
            <p th:text="${product.description}"></p>

            <p th:if="${product.inventory > 0}" class="text-success"
               th:text="${product.inventory} + ' in stock'"></p>
            <p th:unless="${product.inventory > 0}" class="text-danger">Out of stock</p>

            <form th:if="${product.inventory > 0}" th:action="@{/cart/add}" method="post" class="d-flex gap-2">
                <input type="hidden" name="productId" th:value="${product.id}">
                <input type="number" name="quantity" value="1" min="1" th:max="${product.inventory}"
                       class="form-control" style="width: 6rem" aria-label="Quantity" required>
                <button type="submit" class="btn btn-primary">Add to cart</button>
            </form>
        </div>
    </div>
</main>
</body>
</html>
