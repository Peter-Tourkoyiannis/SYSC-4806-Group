<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title th:text="${shop.name}">Shop</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>

<body class="container mt-5">
    <a th:href="@{/shops}" class="btn btn-link px-0 mb-3">&larr; Back to shops</a>

    <div class="mb-4">
        <h1 th:text="${shop.name}">Shop Name</h1>
        <p class="text-muted" th:text="${shop.description}">Description</p>
        <a th:each="tag : ${shop.tags}" th:href="@{/shops(q=${tag})}"
           class="badge bg-secondary me-1 text-decoration-none" th:text="${tag}">tag</a>
    </div>

    <hr>

    <h3>Products</h3>
    <p th:if="${shop.products.isEmpty()}" class="text-muted">
        This shop has no products yet.
    </p>

    <div class="row mt-3">
        <div class="col-md-4 mb-3" th:each="product : ${shop.products}">
            <div class="card h-100">
                <img th:if="${product.imageBytes != null}"
                     th:src="@{/merchant/products/{id}/image(id=${product.id})}"
                     class="card-img-top" style="height: 200px; object-fit: cover;"
                     th:alt="${product.name}">
                <div class="card-body">
                    <h5 class="card-title" th:text="${product.name}">Product</h5>
                    <p class="card-text" th:text="${product.description}">Description</p>
                    <p class="fw-bold mb-1" th:text="${#numbers.formatCurrency(product.price)}">$0.00</p>
                    <p th:if="${product.inventory > 0}" class="text-muted mb-0">
                        In stock: <span th:text="${product.inventory}">0</span>
                    </p>
                    <p th:unless="${product.inventory > 0}" class="text-danger mb-0">Out of stock</p>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
