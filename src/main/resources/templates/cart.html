<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Shopping Cart</title>
</head>
<body>

<h1>Shopping Cart</h1>

<p th:if="${error}" th:text="${error}" style="color: red;"></p>

<p th:if="${warning}" th:text="${warning}" style="color: orange;"></p>

<p th:if="${products.isEmpty()}">Your cart is empty.</p>

<table th:unless="${products.isEmpty()}" border="1">

    <thead>
    <tr>
        <th>Product</th>
        <th>Price</th>
        <th>Quantity</th>
        <th>Subtotal</th>
        <th>Remove</th>
    </tr>
    </thead>

    <tbody>
    <tr th:each="product : ${products}">

        <td th:text="${product.name}"></td>

        <td th:text="${#numbers.formatDecimal(product.price, 1, 2)}"></td>

        <td>
            <form th:action="@{/cart/update}" method="post">

                <input type="hidden" name="productId"
                       th:value="${product.id}">

                <input type="number" name="quantity"
                       th:value="${quantities[product.id]}"
                       min="1" required>

                <button type="submit">Update</button>

            </form>
        </td>

        <td th:text="${#numbers.formatDecimal(product.price * quantities[product.id], 1, 2)}"></td>

        <td>
            <form th:action="@{/cart/remove}" method="post">

                <input type="hidden" name="productId"
                       th:value="${product.id}">

                <button type="submit">Remove</button>

            </form>
        </td>

    </tr>
    </tbody>

</table>

<h2>Total: $<span th:text="${#numbers.formatDecimal(total, 1, 2)}"></span></h2>

<a th:href="@{/shops}">Continue Shopping</a>

<a th:unless="${products.isEmpty()}"
   th:href="@{/checkout}">Checkout</a>

</body>
</html>
