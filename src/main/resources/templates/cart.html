<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shopping Cart</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body>

<nav th:replace="~{fragments/layout :: navbar}"></nav>

<main class="container">

    <h1 class="mb-4">Shopping Cart</h1>

    <p th:if="${error}" th:text="${error}"
       class="alert alert-danger"></p>

    <p th:if="${warning}" th:text="${warning}"
       class="alert alert-warning"></p>

    <p th:if="${products.isEmpty()}"
       class="alert alert-light">Your cart is empty.</p>

    <div class="table-responsive">

        <table th:unless="${products.isEmpty()}"
               class="table table-bordered table-hover align-middle">

            <thead class="table-light">
            <tr>
                <th>Product</th>
                <th>Price</th>
                <th>Quantity</th>
                <th>Subtotal</th>
                <th>Remove</th>
            </tr>
            </thead>

            <tbody>
            <tr th:each="product : ${products}">

                <td th:text="${product.name}"></td>

                <td>
                    $<span th:text="${#numbers.formatDecimal(product.price, 1, 2)}"></span>
                </td>

                <td>
                    <form th:action="@{/cart/update}" method="post"
                          class="d-flex gap-2">

                        <input type="hidden" name="productId"
                               th:value="${product.id}">

                        <input type="number" name="quantity"
                               th:value="${quantities[product.id]}"
                               min="1" required
                               class="form-control"
                               style="width: 90px;">

                        <button type="submit"
                                class="btn btn-outline-primary">
                            Update
                        </button>

                    </form>
                </td>

                <td>
                    $<span th:text="${#numbers.formatDecimal(product.price * quantities[product.id], 1, 2)}"></span>
                </td>

                <td>
                    <form th:action="@{/cart/remove}" method="post">

                        <input type="hidden" name="productId"
                               th:value="${product.id}">

                        <button type="submit"
                                class="btn btn-outline-danger">
                            Remove
                        </button>

                    </form>
                </td>

            </tr>
            </tbody>

        </table>

    </div>

    <h2 class="text-end my-4">
        Total: $<span th:text="${#numbers.formatDecimal(total, 1, 2)}"></span>
    </h2>

    <div class="d-flex justify-content-between">

        <a th:href="@{/shops}" class="btn btn-outline-dark">
            Continue Shopping
        </a>

        <a th:unless="${products.isEmpty()}"
           th:href="@{/checkout}"
           class="btn btn-success">
            Checkout
        </a>

    </div>

</main>

</body>
</html>
