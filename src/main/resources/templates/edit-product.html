<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Edit Product</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="container mt-5">
<h1>Edit Product</h1>
<hr>
<form th:action="@{/merchant/products/{id}/edit(id=${product.id})}" method="post" enctype="multipart/form-data" class="row g-3">
  <input type="hidden" name="version" th:value="${product.version}">
  <div class="col-md-6">
    <label class="form-label">Product Name</label>
    <input type="text" name="name" th:value="${product.name}" class="form-control" required>
  </div>
  <div class="col-md-3">
    <label class="form-label">Price ($)</label>
    <input type="number" name="price" th:value="${product.price}" min="0" step="0.01" class="form-control" required>
  </div>
  <div class="col-md-3">
    <label class="form-label">Inventory Quantity</label>
    <input type="number" name="inventory" th:value="${product.inventory}" min="0" step="1" class="form-control" required>
  </div>
  <div class="col-12">
    <label class="form-label">Description</label>
    <textarea name="description" th:text="${product.description}" class="form-control" rows="3" required></textarea>
  </div>
  <div class="col-12" th:if="${product.imageBytes != null}">
    <label class="form-label">Current Image</label>
    <div>
      <img th:src="@{/merchant/products/{id}/image(id=${product.id})}" alt="Current Product Image" class="img-thumbnail" style="max-height: 200px;">
    </div>
  </div>
  <div class="col-12">
    <label class="form-label">Replace Product Image</label>
    <input type="file" name="image" class="form-control" accept="image/jpeg,image/png,image/gif,image/webp">
    <small class="text-muted">Leave empty to keep the existing image.</small>
  </div>
  <div class="col-12">
    <button type="submit" class="btn btn-primary">Save Changes</button>
    <a th:href="@{/merchant/shops/{id}/dashboard(id=${product.shop.id})}" class="btn btn-secondary">Cancel</a>
  </div>
</form>
</body>
</html>
