<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Create Shop</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="container mt-5" style="max-width: 600px;">
    <h2>Step 1: Create Your Shop</h2>
    <form action="/merchant/shops" method="post" class="mt-4">
        <div class="mb-3">
            <label class="form-label">Merchant Name:</label>
            <input type="text" name="merchantName" class="form-control" required>
        </div>
        <div class="mb-3">
            <label class="form-label">Shop Name:</label>
            <input type="text" name="shopName" class="form-control" required>
        </div>
        <div class="mb-3">
            <label class="form-label">Shop Description:</label>
            <textarea name="description" class="form-control" rows="3" required></textarea>
        </div>
        <div class="mb-3">
            <label class="form-label">Categories / Tags (comma separated):</label>
            <input type="text" name="tagsString" class="form-control" placeholder="e.g. electronics, apparel">
        </div>
        <button type="submit" class="btn btn-success w-100">Next: Add Products</button>
    </form>
</body>
</html>
