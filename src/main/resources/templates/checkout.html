<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout | Mini-Shopify</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="bg-light">
    <div class="container min-vh-100 d-flex align-items-center justify-content-center">
        <div class="card shadow-sm border-0 rounded-4 p-4"
             style="width: 100%; max-width: 520px;">
             <h1 class="h3 fw-bold">Checkout</h1>
             <p class="text-muted">Please review your order before placing it.</p>
             <div th:each="product : ${products}">
                <p th:text="${product.name}"></p>
                <p>
                    Quantity: <span th:text="${cartItems[product.id]}"></span>
                </p>
                <p class="mb-1">
                    Unit price:
                    <span th:text="${#numbers.formatCurrency(product.price)}"></span>
                </p>
                <p class="fw-semibold">
                    Subtotal:
                    <span th:text="${#numbers.formatCurrency(product.price * cartItems[product.id])}"></span>
                </p>
            </div>
            <div class="d-flex justify-content-between border-top pt-3 mt-3 mb-3">
                <strong>Order Total</strong>
                <strong th:text="${#numbers.formatCurrency(total)}">$0.00</strong>
            </div>
             <div th:if="${error}" class="alert alert-danger" role="alert">
                <span th:text="${error}"></span>
             </div>
             <form action="/checkout" method="post">
                <button type="submit" class="btn btn-success w-100 mt-3">
                    Place Order
                </button>
             </form>
        </div>
    </div>
</body>
</html>
