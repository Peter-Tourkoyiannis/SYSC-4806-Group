<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Shop Dashboard</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="container mt-5">
    <div class="mb-4">
        <div class="d-flex justify-content-end gap-2 mb-3">
            <a th:href="@{/shops/{id}(id=${shop.id})}" class="btn btn-outline-primary">View as customer</a>
            <a th:href="@{/}" class="btn btn-outline-dark">Home</a>
        </div>
        <h1 th:text="${shop.name}">Shop Name</h1>
        <p class="text-muted" th:text="${shop.description}">Description</p>
        <div>
            <span th:each="tag : ${shop.tags}" class="badge bg-secondary me-1" th:text="${tag}">Tag</span>
        </div>
    </div>

    <hr>

    <h3>Add Product to Inventory</h3>
    <form th:action="@{/merchant/shops/{id}/products(id=${shop.id})}" method="post" enctype="multipart/form-data" class="row g-3 mt-2">
        <div class="col-md-6">
            <label class="form-label">Product Name</label>
            <input type="text" name="name" class="form-control" required>
        </div>
        <div class="col-md-3">
            <label class="form-label">Price ($)</label>
            <input type="number" step="0.01" name="price" class="form-control" required>
        </div>
        <div class="col-md-3">
            <label class="form-label">Inventory Quantity</label>
            <input type="number" name="inventory" class="form-control" required>
        </div>
        <div class="col-12">
            <label class="form-label">Description</label>
            <textarea name="description" class="form-control" rows="2" required></textarea>
        </div>
        <div class="col-12">
            <label class="form-label">Product Image</label>
            <input type="file" name="image" class="form-control" accept="image/*" required>
        </div>
        <div class="col-12">
            <button type="submit" class="btn btn-primary">Add Product</button>
        </div>
    </form>

    <h3 class="mt-5">Current Products in Shop</h3>
    <div class="row mt-3">
        <div class="col-md-4 mb-3" th:each="product : ${shop.products}">
            <div class="card h-100">
                <img th:src="@{/merchant/products/{id}/image(id=${product.id})}" class="card-img-top" style="height: 200px; object-fit: cover;" alt="Product Image">
                <div class="card-body">
                    <h5 class="card-title" th:text="${product.name}">Product Name</h5>
                    <p class="card-text" th:text="${product.description}">Description</p>
                    <p class="fw-bold">$<span th:text="${product.price}">0.00</span></p>
                    <p class="text-muted">Stock: <span th:text="${product.inventory}">0</span></p>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
