<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Find your shop today!</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>

<body class="container mt-5">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h1>Find your shop today!</h1>
        <a href="/" class="btn btn-outline-dark">Home</a>
    </div>

    <form th:action="@{/shops}" method="get" class="d-flex gap-2 mb-4">
        <input type="search" name="q" th:value="${q}" class="form-control"
               placeholder="Search by shop name or category (e.g. electronics)" aria-label="Search shops">
        <button type="submit" class="btn btn-primary">Search</button>
        <a th:if="${!q.isEmpty()}" th:href="@{/shops}" class="btn btn-outline-secondary">Clear</a>
    </form>

    <p th:if="${!q.isEmpty()}" class="text-muted">
        <span th:text="${shops.size()}">0</span> result(s) for "<span th:text="${q}">q</span>"
    </p>

    <div th:if="${shops.isEmpty()}" class="alert alert-light">
        No shops found.
    </div>

    <div class="row">
        <div class="col-md-4 mb-3" th:each="shop : ${shops}">
            <div class="card h-100">
                <div class="card-body">
                    <h5 class="card-title">
                        <a th:href="@{/shops/{id}(id=${shop.id})}" th:text="${shop.name}"
                           class="stretched-link text-decoration-none">Shop</a>
                    </h5>
                    <p class="card-text text-muted" th:text="${shop.description}">Description</p>
                    <span th:each="tag : ${shop.tags}" class="badge bg-secondary me-1" th:text="${tag}">tag</span>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
