<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Edit Shop</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="mt-5">
    <div th:replace="~{fragments/layout :: navbar}"></div>
    <main class="container" style="max-width: 600px;">
    <div class="d-flex justify-content-between align-items-center">
        <h1>Edit Shop</h1>
        <a th:href="@{/merchant/shops/{id}/dashboard(id=${shopId})}" class="btn btn-outline-secondary">Cancel</a>
    </div>
    <form th:action="@{/merchant/shops/{id}/edit(id=${shopId})}" th:object="${editShopForm}"
          method="post" class="mt-4">
        <div class="mb-3">
            <label for="name" class="form-label">Shop Name:</label>
            <input id="name" type="text" th:field="*{name}" class="form-control">
            <div th:if="${#fields.hasErrors('name')}" th:errors="*{name}" class="text-danger"></div>
        </div>
        <div class="mb-3">
            <label for="description" class="form-label">Shop Description:</label>
            <textarea id="description" th:field="*{description}" class="form-control" rows="3"></textarea>
            <div th:if="${#fields.hasErrors('description')}" th:errors="*{description}" class="text-danger"></div>
        </div>
        <div class="mb-3">
            <label for="tagsString" class="form-label">Categories / Tags (comma separated):</label>
            <input id="tagsString" type="text" th:field="*{tagsString}" class="form-control">
        </div>
        <button type="submit" class="btn btn-primary">Save Changes</button>
    </form>
    </main>
</body>
</html>
