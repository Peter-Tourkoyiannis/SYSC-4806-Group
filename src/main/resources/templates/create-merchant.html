<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Create Merchant</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body>
    <div th:replace="~{fragments/layout :: navbar}"></div>
    <main class="container">
    <div class="d-flex justify-content-between align-items-center">
        <h1>Create a New Merchant</h1>
        <a th:href="@{/merchant/shops/new}" class="btn btn-outline-secondary">Cancel</a>
    </div>
    <form th:action="@{/merchant/merchants}" th:object="${merchantForm}" method="post" class="mt-4">
        <div class="mb-3">
            <label for="name" class="form-label">Merchant Name:</label>
            <input id="name" type="text" th:field="*{name}" class="form-control">
            <div th:if="${#fields.hasErrors('name')}" th:errors="*{name}" class="text-danger"></div>
        </div>
        <button type="submit" class="btn btn-success">Create Merchant</button>
    </form>
    </main>
</body>
</html>
